    customGroupBody:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
        membersId:
          description: members id
          type: array
          items:
            type: string
            pattern: ^g:[c]:[a-zA-Z0-9]{8}$
          example:
          - g:c:ab124as2
        conditions:
          $ref: '#/components/schemas/groupConditions'
          minProperties: 1
          example:
            osNamePatterns:
            - Windows.*
            assetTypes:
            - 1
            - 2
      x-speakeasy-entity: CustomGroup
    customGroup:
      type: object
      properties:
        createdAt:
          $ref: '#/components/schemas/epochMillis'
        description:
          type: string
        directMembersCount:
          type: integer
        domain:
          type: string
        guid:
          type: string
          format: uuid
        hasProtectionPolicy:
          type: boolean
        id:
          type: string
        name:
          type: string
        principalName:
          type: string
        role:
          type: integer
        sid:
          type: string
        updatedAt:
          $ref: '#/components/schemas/epochMillis'
        addedAt:
          $ref: '#/components/schemas/epochMillis'
        addedBy:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
              example: User Name
      x-speakeasy-entity: CustomGroup
    emptyResponse:
      type: object
    customGroupResponse:
      type: object
      properties:
        entity:
          $ref: '#/components/schemas/customGroup'
    groupConditions:
      type: object
      properties:
        domains:
          type: array
          items:
            type: string
        namePatterns:
          type: array
          items:
            type: string
        osNamePatterns:
          type: array
          items:
            type: string
        osTypes:
          type: array
          items:
            $ref: '#/components/schemas/osType'
        assetTypes:
          type: array
          items:
            $ref: '#/components/schemas/assetType'
        ipBuiltins:
          type: array
          items:
            type: string
    groupMembersList:
      type: object
      properties:
        membersId:
          type: array
          items:
            type: string
      x-speakeasy-entity: CustomGroupMembers
    osType:
      description: "Possible osType:\n  * '1' - Unmanagable\n  * '2' - Windows\n  * '3' - Linux\n  * '4' - Mac\n"
      type: integer
      format: int32
      enum:
      - 1
      - 2
      - 3
      - 4
    epochMillis:
      description: Epoch Millis
      type: integer
      format: int64
      title: epochMillis
  responses:
    200_empty:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/emptyResponse'
    '409':
      description: Already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '500':
      description: Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
  parameters:
    groupIdParameter:
      name: groupId
      in: path
      description: groupId to filter on
      required: true
      schema:
        type: string
        pattern: ^g:[acsot]:[a-zA-Z0-9]{8}$
      example: g:t:01445453
      x-speakeasy-name-override: id
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
