note: >-
  Zero Networks does NOT use RFC 9457 problem+json. Every documented 4xx/5xx response on
  every one of the 40 operations returns application/json carrying the same two-field
  envelope defined once in components.schemas.error. There is no error `code`, `type` URI,
  `instance`, `detail` or `trace_id` field, and the spec publishes no example for any error
  response (0 of 218 error responses carry an example), so the value space of the `error`
  string is not enumerated anywhere the provider publishes. The one concrete pair below was
  observed live and unauthenticated; it is the only error body we can state as fact. No
  public error-code reference exists on the vendor site or its Cloudflare-gated help center,
  so titles/remediation could not be enriched by search.
envelope:
