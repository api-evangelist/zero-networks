aid: zero-networks
name: Zero Networks
description: 'Zero Networks is an Israeli-American network security company whose Segment
  platform delivers automated, agentless microsegmentation and identity segmentation for
  enterprise networks. It builds a host-based firewall "bubble" around every asset, learns
  normal east-west traffic for 30 days, then auto-generates least-privilege allow rules and
  closes privileged ports behind just-in-time multi-factor authentication — extending MFA to
  protocols such as RDP, SSH, SMB, WinRM and RPC that were never designed for it. The platform
  also covers identity segmentation for admin and service accounts, Kubernetes segmentation,
  OT/IoT assets, and a ZTNA-style secure remote access product that replaces VPN. Zero Networks
  operates a customer-facing REST API at portal.zeronetworks.com/api/v1 secured with an
  Authorization API token issued from the console, and publishes a first-party OpenAPI 3.0.1
  contract plus Speakeasy-generated Python, PowerShell and Terraform clients from its own
  GitHub organization.'
