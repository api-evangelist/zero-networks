apis:
- aid: zero-networks-platform
  name: Zero Networks Platform API
  description: 'The Zero Networks platform REST API, exposing the segmentation and identity
    control surface of the Zero Networks console: assets and asset protection state, inbound
    and outbound segmentation rules, MFA (reactive) policies, RPC rules, Automation Engine
    exclusions, internal access policies, custom groups and group membership, users and roles,
    Kubernetes workloads, cloud connectors, audit and network/logon activity, and platform
    settings including webhooks and SIEM event export. Authentication is an API token minted in
    the console under Settings > API and sent in the Authorization header.'
